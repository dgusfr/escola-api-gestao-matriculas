name: CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest

    # Sobe um container PostgreSQL como serviço, igual ao nosso docker-compose.yml
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: escola_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escola_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # Variáveis de ambiente disponíveis para todos os steps deste job
    env:
      SECRET_KEY: "django-insecure-chave-super-secreta-para-uso-exclusivo-de-ci"
      DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: escola_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: ⚡ Instalar o uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar dependências com uv
        run: uv sync

      - name: 🔍 Rodar Linter (ruff)
        run: uv run ruff check .

      - name: 🗄️ Aplicar migrações do banco de dados
        run: uv run python manage.py migrate

      - name: ✅ Rodar suíte de testes
        run: uv run python manage.py test -v 2

